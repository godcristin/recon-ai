server:
  http:
    addr: 0.0.0.0:8000
    timeout: 5s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 10s

data:
  database:
    driver: postgres
    # 本地默认值；真实环境通过环境变量或部署配置覆盖
    source: "host=127.0.0.1 user=postgres password=postgres dbname=recon port=5432 sslmode=disable TimeZone=Asia/Shanghai"
    max_idle: 5
    max_open: 20
    conn_max_lifetime: 600s
