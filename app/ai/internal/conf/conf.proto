syntax = "proto3";
package ai.conf;
option go_package = "recon-ai/app/ai/internal/conf;conf";
import "google/protobuf/duration.proto";
message Bootstrap {
  Server server = 1;
  Llm llm = 2;
}
message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}
message Llm {
  string base_url = 1;
  string model = 2;
  string api_key_env = 3;
  google.protobuf.Duration timeout = 4;
  bool enable = 5;
  int32 max_tokens = 6;
}
