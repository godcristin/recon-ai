syntax = "proto3";

package core.conf;

option go_package = "recon-ai/app/core/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap 是 core 服务的完整配置，对应 configs/core.yaml
message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    int32 max_idle = 3;
    int32 max_open = 4;
    google.protobuf.Duration conn_max_lifetime = 5;
  }
  Database database = 1;
}
