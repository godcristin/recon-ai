syntax = "proto3";
package api.ai.v1;
option go_package = "recon-ai/api/ai/v1;v1";
import "api/recon/v1/recon.proto";
service Ai {
  rpc ClassifyDiff(ClassifyDiffReq) returns (ClassifyDiffRsp);
}
message ClassifyDiffReq {
  string diff_type = 1;
  api.recon.v1.Record channel = 2;
  api.recon.v1.Record system = 3;
  int64 amount_diff = 4;
  int64 time_diff_hours = 5;
}
message ClassifyDiffRsp {
  string category = 1;
  double confidence = 2;
  string reason = 3;
  repeated string evidence = 4;
  string suggestion = 5;
  bool fallback = 6;
  string model = 7;
  string prompt_version = 8;
  int32 tokens_in = 9;
  int32 tokens_out = 10;
  int64 latency_ms = 11;
  bool cached = 12;
}
