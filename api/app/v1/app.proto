syntax = "proto3";
package api.app.v1;
option go_package = "recon-ai/api/app/v1;v1";
import "google/api/annotations.proto";
import "api/recon/v1/recon.proto";
service App {
  rpc GetTask(api.recon.v1.GetTaskReq) returns (api.recon.v1.Task) {
    option (google.api.http) = {
      get: "/api/tasks/{id}"
    };
  }
  rpc ListDiffs(api.recon.v1.ListDiffsReq) returns (api.recon.v1.ListDiffsRsp) {
    option (google.api.http) = {
      get: "/api/tasks/{task_id}/diffs"
    };
  }
  rpc GetDiff(api.recon.v1.GetDiffReq) returns (api.recon.v1.DiffDetail) {
    option (google.api.http) = {
      get: "/api/diffs/{id}"
    };
  }
  rpc ConfirmDiff(api.recon.v1.ConfirmDiffReq) returns (api.recon.v1.ConfirmDiffRsp) {
    option (google.api.http) = {
      post: "/api/diffs/{diff_id}/confirm"
      body: "*"
    };
  }
  rpc GetTaskSummary(api.recon.v1.GetTaskSummaryReq) returns (api.recon.v1.TaskSummaryRsp) {
    option (google.api.http) = {
      get: "/api/tasks/{task_id}/summary"
    };
  }
}
