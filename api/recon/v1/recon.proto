syntax = "proto3";
package api.recon.v1;
option go_package = "recon-ai/api/recon/v1;v1";
import "validate/validate.proto";
service Recon {
  rpc CreateTask(CreateTaskReq) returns (CreateTaskRsp);
  rpc GetTask(GetTaskReq) returns (Task);
  rpc ListDiffs(ListDiffsReq) returns (ListDiffsRsp);
  rpc GetDiff(GetDiffReq) returns (DiffDetail);
  rpc SaveClassification(SaveClassificationReq) returns (SaveClassificationRsp);
  rpc ConfirmDiff(ConfirmDiffReq) returns (ConfirmDiffRsp);
  rpc GetTaskSummary(GetTaskSummaryReq) returns (TaskSummaryRsp);
}
message Record {
  int64 id = 1;
  int32 source = 2;
  string trade_no = 3;
  string biz_no = 4;
  int64 amount = 5;
  int64 fee = 6;
  string trade_time = 7;
  string status = 8;
  string remark = 9;
}
message Diff {
  int64 id = 1;
  int64 task_id = 2;
  string diff_type = 3;
  int64 amount_diff = 4;
  string category = 5;
  double confidence = 6;
  string reason = 7;
  repeated string evidence = 8;
  string suggestion = 9;
  string state = 10;
  bool fallback = 11;
  string ai_model = 12;
  string prompt_version = 13;
  int64 create_time = 14;
}
message DiffDetail {
  Diff diff = 1;
  Record channel = 2;
  Record system = 3;
  string match_rule = 4;
  int64 time_diff_hours = 5;
}
message Task {
  int64 id = 1;
  string name = 2;
  string status = 3;
  int32 total_count = 4;
  int32 diff_count = 5;
  int64 diff_amount = 6;
  int64 create_time = 7;
  int64 finish_time = 8;
}
message ParseError {
  int32 line = 1;
  string message = 2;
}
message CreateTaskReq {
  string name = 1 [(validate.rules).string = {min_len: 1, max_len: 64}];
  bytes channel_csv = 2 [(validate.rules).bytes.min_len = 1];
  bytes system_csv = 3 [(validate.rules).bytes.min_len = 1];
}
message CreateTaskRsp {
  int64 task_id = 1;
  int32 total_count = 2;
  int32 diff_count = 3;
  repeated ParseError parse_errors = 4;
}
message GetTaskReq {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}
message ListDiffsReq {
  int64 task_id = 1 [(validate.rules).int64.gt = 0];
  string category = 2;
  string state = 3;
  int32 page = 4;
  int32 page_size = 5 [(validate.rules).int32 = {gte: 0, lte: 100}];
}
message ListDiffsRsp {
  repeated Diff list = 1;
  int32 total = 2;
  int64 total_amount = 3;
}
message GetDiffReq {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}
message SaveClassificationReq {
  int64 diff_id = 1 [(validate.rules).int64.gt = 0];
  string category = 2;
  double confidence = 3;
  string reason = 4;
  repeated string evidence = 5;
  string suggestion = 6;
  bool fallback = 7;
  string ai_model = 8;
  string prompt_version = 9;
}
message SaveClassificationRsp {
  bool ok = 1;
}
message ConfirmDiffReq {
  int64 diff_id = 1 [(validate.rules).int64.gt = 0];
  string action = 2;
  string human_category = 3;
  string operator = 4;
}
message ConfirmDiffRsp {
  bool ok = 1;
  string state = 2;
}
message GetTaskSummaryReq {
  int64 task_id = 1 [(validate.rules).int64.gt = 0];
}
message CategoryStat {
  string category = 1;
  int32 count = 2;
  int64 amount = 3;
}
message TaskSummaryRsp {
  int32 total = 1;
  int32 diff_count = 2;
  int64 diff_amount = 3;
  repeated CategoryStat stats = 4;
  double ai_accept_rate = 5;
}
